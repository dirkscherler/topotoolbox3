name: Latest Release
on:
  push:
    branches: ["main"]

jobs:
  docs:
    if: github.repository == 'TopoToolbox/topotoolbox3'
    name: Build docs
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: TopoToolbox/actions/checkout@main
        with:
          submodules: true
      - name: Set up MATLAB
        uses: TopoToolbox/actions/setup-matlab@main
        with:
          release: latest
          cache: false
          products: >-
            Mapping_Toolbox
            Image_Processing_Toolbox
            Optimization_Toolbox
            MATLAB_Coder
      - name: Compile libtopotoolbox and MEX files
        uses: TopoToolbox/actions/run-build@main
        with:
          tasks: compile
      - name: Build docs
        uses: TopoToolbox/actions/run-build@main
        with:
          tasks: doc
      - name: Upload docs as artifact
        uses: TopoToolbox/actions/upload-artifact@main
        with:
          name: toolbox-docs
          path: toolbox/docs/html
  package:
    if: github.repository == 'TopoToolbox/topotoolbox3'
    name: Package toolbox
    needs: [docs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        mex: [ true ]
        include:
          - os: windows-latest
            mex: false
    steps:
      - name: Checkout repository
        uses: TopoToolbox/actions/checkout@main
        with:
          submodules: true
      - name: Set up MATLAB
        uses: TopoToolbox/actions/setup-matlab@main
        with:
          cache: ${{ matrix.os != 'windows-latest' }}
          products: >
            Mapping_Toolbox
            Image_Processing_Toolbox
            Optimization_Toolbox
            MATLAB_Coder
      - name: Download created docs
        uses: TopoToolbox/actions/download-artifact@main
        with:
          name: toolbox-docs
          path: toolbox/docs/html/
      - name: Build MEX files
        if: ${{ matrix.mex }}
        uses: TopoToolbox/actions/run-build@main
        with:
          tasks: compile
      - name: Build package
        uses: TopoToolbox/actions/run-build@main
        with:
          tasks: package
      - name: Move un-compiled package to one with a generic name
        if: ${{ ! matrix.mex }}
        shell: bash
        run: mv release/TopoToolbox_win64.mltbx release/TopoToolbox_nolibtt.mltbx
      - name: Upload toolbox as artifact
        uses: TopoToolbox/actions/upload-artifact@main
        with:
          name: toolbox-${{ matrix.os }}-${{ matrix.mex }}
          path: release/TopoToolbox_*.mltbx
  test:
    name: Download, install and test the toolbox
    runs-on: ${{ matrix.os }}
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        matlab-version: [R2023b, R2024a, R2024b, R2025a, R2025b, R2026a]
    steps:
      - name: Checkout repository
        uses: TopoToolbox/actions/checkout@main
      - name: Setup MATLAB
        uses: TopoToolbox/actions/setup-matlab@main
        with:
          release: ${{ matrix.matlab-version }}
          cache: ${{ matrix.os != 'windows-latest' }}
          products: >-
            Mapping_Toolbox
            Image_Processing_Toolbox
            MATLAB_Coder
      - name: Download artifacts
        with:
          name: toolbox-${{ matrix.os }}
          path: release/
        uses: TopoToolbox/actions/download-artifact@main
      - name: Run toolbox build step
        uses: TopoToolbox/actions/run-build@main
        with:
          tasks: testToolbox        
  release:
    if: github.repository == 'TopoToolbox/topotoolbox3'
    name: Update release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - uses: TopoToolbox/actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true # Fetch all the tags so that we compute release number correctly
      - name: Download compiled toolboxes
        uses: TopoToolbox/actions/download-artifact@main
        with:
          path: release/
          pattern: "toolbox-*-*"
          merge-multiple: true
      - name: Generate tag
        id: tag
        run: |
          PREFIX="release-$(date +'%Y%m%d')-"
          MAX=$(git tag -l "${PREFIX}*" | sed -E "s/^${PREFIX}([0-9]+)/\1/" | sort -n | tail -n1)
          NEXT=$((${MAX:-0} + 1))
          NEW_TAG="${PREFIX}${NEXT}"
          echo "TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "This release will be tagged: $NEW_TAG"
      - name: Create release
        run: |
          gh release create $TAG --target main --generate-notes --latest -F .github/latest_release.md
      - name: Upload toolbox assets
        shell: bash
        run: gh release upload --repo $GITHUB_REPOSITORY $TAG release/*
